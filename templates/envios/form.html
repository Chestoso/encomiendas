{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-white">
        <h4 class="mb-0">{{ titulo }}</h4>
    </div>

    <div class="card-body">

        <!-- Formulario de nueva encomienda -->
        <form method="post" novalidate>
            {% csrf_token %}

            <!-- Recorre todos los campos del formulario -->
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    <!-- Errores de validación -->
                    {% if field.errors %}
                        <div class="text-danger small">
                            {{ field.errors }}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary">
                Guardar
            </button>

            <a href="{% url 'encomienda_lista' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
